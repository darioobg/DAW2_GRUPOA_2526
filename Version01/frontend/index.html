<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Google Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Tu CSS -->
  <link rel="stylesheet" href="./css/index.css">

  <title>TaskFlow – Tableros</title>
</head>

<body>

  <!-- Usamos Bootstrap: container-fluid + row + col para el layout -->
  <div class="container-fluid p-0">
    <div class="row g-0 min-vh-100">
      <div class="container mitadI">
        <!-- Aqui tiene que ir el logo de TaskFlow -->
         <!-- <img src="logo" alt="logo" class="logo"> -->
        <h1>TaskFlow</h1>

        <h2 class="fraseInicio">TaskFlow ayuda en los equipos a avanzar en el Trabajo</h2>
      </div>
      <div class="container mitadD">
        <h1>TaskFlow</h1>
      </div>

    </div> <!-- /row -->
  </div> <!-- /container-fluid -->
<!-- Modal Crear Tablero -->
<div class="modal fade" id="modalCrearTablero" tabindex="-1" aria-labelledby="modalCrearTableroLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <!-- Header -->
      <div class="modal-header">
        <h5 class="modal-title" id="modalCrearTableroLabel">Crear nuevo tablero</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <!-- Body -->
      <div class="modal-body">
        <form id="formCrearTablero">

          <!-- Nombre -->
          <div class="mb-3">
            <label class="form-label">Nombre del tablero</label>
            <input type="text" class="form-control" id="nombreTablero" required>
          </div>

          <!-- Color -->
          <div class="mb-3">
            <label class="form-label">Color de fondo</label>
            <input type="color" class="form-control form-control-color" id="colorFondo" value="#0c6bf2">
          </div>

          <!-- Equipo -->
          <div class="mb-3">
            <label class="form-label">Equipo</label>
            <input type="text" class="form-control" id="equipoTablero" placeholder="Opcional">
          </div>

        </form>
      </div>

      <!-- Footer -->
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btnGuardarTablero">Crear tablero</button>
      </div>

    </div>
  </div>
</div>

  <!-- JS Bootstrap (si luego usas dropdowns, modals, etc.) -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Más adelante aquí irán tus scripts JS: api, ui, app -->
  <!-- <script src="../public/assets/js/api/proyectos.api.js"></script> -->
  <!-- <script src="../public/assets/js/ui/pintarTableros.js"></script> -->
  <script type="module" src="../frontend/js/app.js" defer></script> 
</body>

</html>
